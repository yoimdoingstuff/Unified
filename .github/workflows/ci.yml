name: ci

# host-tests: UIKit-independent unit tests on build hosts.
# tweak-build: builds the single universal Theos package (armv7 + arm64,
# iOS 5-10). A successful build does NOT mean the tweak works; nothing
# here runs on an iOS device.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: make -C tests CC=${{ matrix.cc }}
      - name: Unit tests with sanitizers
        run: |
          make -C tests clean
          make -C tests CC=${{ matrix.cc }} EXTRA_CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"

  tweak-build:
    # Linux: the Theos Linux toolchain still links armv7; recent Xcode does not.
    # SDK: theos/sdks iPhoneOS 10.3. The 9.3 SDK fails to link armv7
    # (libSystem.tbd re-exports liblaunch, but liblaunch.tbd is missing).
    runs-on: ubuntu-22.04
    env:
      THEOS: ${{ github.workspace }}/theos
      SDK: "10.3"
    steps:
      - uses: actions/checkout@v5
        with:
          path: Unified

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip git file binutils libxml2 libtinfo5

      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS toolchain (Linux)
        run: |
          mkdir -p "$THEOS/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain"

      - name: Install iPhoneOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set "iPhoneOS$SDK.sdk"
          mkdir -p "$THEOS/sdks"
          cp -R "/tmp/sdks/iPhoneOS$SDK.sdk" "$THEOS/sdks/"

      - name: Record tool versions
        # Job logs need a GitHub sign-in; annotations are public, so report there.
        continue-on-error: true
        run: |
          set +e
          echo "::notice title=theos commit::$(git -C "$THEOS" rev-parse --short HEAD)"
          echo "::notice title=clang::$("$THEOS/toolchain/linux/iphone/bin/clang" --version 2>&1 | head -n 1)"

      - name: Build package
        working-directory: Unified
        run: |
          set -o pipefail
          # messages=yes prints full compiler/linker commands so the
          # per-architecture -target flags can be reported below.
          make package FINALPACKAGE=1 messages=yes 2>&1 | tee build.log

      - name: Report per-architecture target flags
        if: always()
        continue-on-error: true
        working-directory: Unified
        run: |
          [ -f build.log ] || exit 0
          t=$(grep -oE -- '-target [a-z0-9_]+-apple-ios[0-9.]+' build.log | sort | uniq -c)
          echo "$t"
          echo "::notice title=clang -target flags (count, flag)::$(echo "$t" | awk 'BEGIN{ORS="%0A"}{print}')"

      - name: Report build failure
        if: failure()
        working-directory: Unified
        run: |
          [ -f build.log ] || exit 0
          # Annotations are truncated at a few KB. Drop colour codes and the
          # known-harmless "tbd built for iOS Simulator" warnings so the real
          # error fits. %0A is a newline inside an annotation message.
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' build.log \
            | grep -v "but linking in .tbd file" > build.filtered.log || true
          echo "::error title=build log (filtered, last 40 lines)::$(tail -n 40 build.filtered.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          echo "::error title=build log (error lines)::$(grep -inE 'error|undefined|not found|unknown|unsupported' build.filtered.log | tail -n 25 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"

      - name: Report build warnings
        if: success()
        continue-on-error: true
        working-directory: Unified
        run: |
          w=$(sed -e 's/\x1b\[[0-9;]*m//g' build.log | grep -i 'warning' | grep -v "but linking in .tbd file" | head -n 20)
          [ -n "$w" ] && echo "::warning title=build warnings::$(echo "$w" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          exit 0

      - name: Inspect package
        working-directory: Unified
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -n 1)
          mkdir -p /tmp/deb && dpkg-deb -x "$DEB" /tmp/deb
          DYLIB=$(find /tmp/deb -name 'Unified.dylib' | head -n 1)
          # Read the minimum iOS version from each slice's load commands
          # directly (tools/macho_minos.py), not via toolchain utilities.
          MINOS=$(python3 tools/macho_minos.py "$DYLIB")
          THIN=$(for f in $(find .theos -path '*/obj/*' -name Unified.dylib | sort); do echo "$f -> $(python3 tools/macho_minos.py "$f" | tr '\n' ' ')"; done)
          {
            echo "deb: $(basename "$DEB") ($(stat -c %s "$DEB") bytes)"
            echo "members: $(ar t "$DEB" | tr '\n' ' ')"
            dpkg-deb -f "$DEB" Package Version Architecture Depends
            echo "files:"; dpkg-deb -c "$DEB" | awk '{print "  " $6}'
            echo "dylib: $(file -b "$DYLIB")"
            echo "min OS per slice:"; echo "$MINOS" | sed 's/^/  /'
            echo "per-arch build outputs before lipo:"; echo "$THIN" | sed 's/^/  /'
          } > package-info.txt
          cat package-info.txt
          echo "::notice title=package info::$(sed -e 's/%/%25/g' package-info.txt | awk 'BEGIN{ORS="%0A"}{print}')"
          printf '%s\n' "$MINOS" > minos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: unified-deb
          path: Unified/packages/*.deb

      - name: Check universal package
        # Runs after the upload so the .deb is still available if this fails.
        working-directory: Unified
        run: |
          cat minos.txt
          grep -qx 'armv7: version 5.0' minos.txt || { echo "::error title=universal package::armv7 slice must target iOS 5.0"; exit 1; }
          grep -qx 'arm64: version 7.0' minos.txt || { echo "::error title=universal package::arm64 slice must target iOS 7.0"; exit 1; }
