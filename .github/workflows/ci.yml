name: ci

# host-tests: UIKit-independent unit tests on build hosts.
# tweak-build: builds the single universal Theos package (armv7 + arm64,
# iOS 5-10). A successful build does NOT mean the tweak works; nothing
# here runs on an iOS device.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: |
          set -o pipefail
          make -C tests CC=${{ matrix.cc }} 2>&1 | tee tests.log
      - name: Unit tests with sanitizers
        run: |
          set -o pipefail
          make -C tests clean
          make -C tests CC=${{ matrix.cc }} EXTRA_CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" 2>&1 | tee tests.log
      - name: Report test failure
        # Job logs need a GitHub sign-in; annotations are public.
        if: failure()
        run: |
          [ -f tests.log ] || exit 0
          echo "::error title=${{ matrix.os }} ${{ matrix.cc }} diagnostics::$(grep -E 'error:|warning:|CHECK failed|FAILED|expected' tests.log | head -n 30 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          echo "::error title=${{ matrix.os }} ${{ matrix.cc }} log tail::$(tail -n 25 tests.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"

  tweak-build:
    # Linux: the Theos Linux toolchain still links armv7; recent Xcode does not.
    # SDK: theos/sdks iPhoneOS 10.3. The 9.3 SDK fails to link armv7
    # (libSystem.tbd re-exports liblaunch, but liblaunch.tbd is missing).
    runs-on: ubuntu-22.04
    env:
      THEOS: ${{ github.workspace }}/theos
      SDK: "10.3"
    steps:
      - uses: actions/checkout@v5
        with:
          path: Unified

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip git file binutils libxml2 libtinfo5

      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS toolchain (Linux)
        run: |
          mkdir -p "$THEOS/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain"

      - name: Install iPhoneOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set "iPhoneOS$SDK.sdk"
          mkdir -p "$THEOS/sdks"
          cp -R "/tmp/sdks/iPhoneOS$SDK.sdk" "$THEOS/sdks/"

      - name: Record tool versions
        # Job logs need a GitHub sign-in; annotations are public, so report there.
        continue-on-error: true
        run: |
          set +e
          echo "::notice title=theos commit::$(git -C "$THEOS" rev-parse --short HEAD)"
          echo "::notice title=clang::$("$THEOS/toolchain/linux/iphone/bin/clang" --version 2>&1 | head -n 1)"

      - name: Build package
        working-directory: Unified
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        working-directory: Unified
        run: |
          [ -f build.log ] || exit 0
          # Annotations are truncated at a few KB. Drop colour codes and the
          # known-harmless "tbd built for iOS Simulator" warnings so the real
          # error fits. %0A is a newline inside an annotation message.
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' build.log \
            | grep -v "but linking in .tbd file" > build.filtered.log || true
          # Diagnostics only (file:line: error:), with the line after each for
          # the offending source; Theos passes -Werror, so warnings count.
          echo "::error title=build diagnostics::$(grep -E -A2 '(error|warning): ' build.filtered.log | head -n 45 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          echo "::error title=build log (last 25 lines)::$(tail -n 25 build.filtered.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"

      - name: Report build warnings
        if: success()
        continue-on-error: true
        working-directory: Unified
        run: |
          # Match diagnostics ("warning:"), not command lines that mention warnings.
          w=$(sed -e 's/\x1b\[[0-9;]*m//g' build.log | grep -E 'warning: ' | grep -v "but linking in .tbd file" | head -n 20)
          [ -n "$w" ] && echo "::warning title=build warnings::$(echo "$w" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          exit 0

      - name: Inspect package
        working-directory: Unified
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -n 1)
          rm -rf /tmp/deb && mkdir -p /tmp/deb && dpkg-deb -x "$DEB" /tmp/deb
          # Every Mach-O in the package, with the minimum iOS version of each
          # slice read directly from its load commands (tools/macho_minos.py).
          : > minos.txt
          for f in $(find /tmp/deb -type f | sort); do
            if file -b "$f" | grep -q 'Mach-O'; then
              echo "${f#/tmp/deb}" >> minos.txt
              python3 tools/macho_minos.py "$f" | sed 's/^/  /' >> minos.txt
            fi
          done
          {
            echo "deb: $(basename "$DEB") ($(stat -c %s "$DEB") bytes)"
            echo "members: $(ar t "$DEB" | tr '\n' ' ')"
            dpkg-deb -f "$DEB" Package Version Architecture Depends
            echo "files:"; dpkg-deb -c "$DEB" | awk '{print "  " $6}'
            echo "Mach-O files, min iOS per slice:"; sed 's/^/  /' minos.txt
          } > package-info.txt
          cat package-info.txt
          echo "::notice title=package info::$(sed -e 's/%/%25/g' package-info.txt | awk 'BEGIN{ORS="%0A"}{print}')"

      - uses: actions/upload-artifact@v4
        with:
          name: unified-deb
          path: Unified/packages/*.deb

      - name: Check universal package
        # Runs after the upload so the .deb is still available if this fails.
        working-directory: Unified
        run: |
          fail=0
          for p in \
              /Library/MobileSubstrate/DynamicLibraries/Unified.dylib \
              /Library/MobileSubstrate/DynamicLibraries/Unified.plist \
              /Library/PreferenceBundles/UnifiedPrefs.bundle/UnifiedPrefs \
              /Library/PreferenceBundles/UnifiedPrefs.bundle/Info.plist \
              /Library/PreferenceBundles/UnifiedPrefs.bundle/icon.png \
              /Library/PreferenceLoader/Preferences/Unified.plist; do
            [ -f "/tmp/deb$p" ] || { echo "::error title=package contents::missing $p"; fail=1; }
          done
          # Each Mach-O must have exactly: armv7 at iOS 5.0 and arm64 at iOS 7.0.
          python3 - <<'EOF' || fail=1
          import sys
          files, current = {}, None
          for line in open("minos.txt"):
              if not line.startswith("  "):
                  current = line.strip(); files[current] = []
              else:
                  files[current].append(line.strip())
          bad = False
          for name, slices in files.items():
              if sorted(slices) != ["arm64: version 7.0", "armv7: version 5.0"]:
                  print(f"::error title=universal package::{name}: {slices}")
                  bad = True
          if not files:
              print("::error title=universal package::no Mach-O files found"); bad = True
          sys.exit(1 if bad else 0)
          EOF
          exit $fail
