name: ci

# host-tests: UIKit-independent unit tests on build hosts.
# tweak-build: builds the Theos package for armv7. A successful build does
# NOT mean the tweak works; nothing here runs on an iOS device.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: make -C tests CC=${{ matrix.cc }}
      - name: Unit tests with sanitizers
        run: |
          make -C tests clean
          make -C tests CC=${{ matrix.cc }} EXTRA_CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"

  tweak-build:
    # Linux: the Theos Linux toolchain still links armv7; recent Xcode does not.
    # Two SDKs are tried side by side until one is confirmed to link armv7.
    strategy:
      fail-fast: false
      matrix:
        sdk: ["9.3", "10.3"]
    runs-on: ubuntu-22.04
    env:
      THEOS: ${{ github.workspace }}/theos
      SDK: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: Unified

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip git libxml2 libtinfo5

      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS toolchain (Linux)
        run: |
          mkdir -p "$THEOS/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain"
          # Logs need a GitHub sign-in; annotations are public, so report layout there.
          echo "::notice title=toolchain layout::$(find "$THEOS/toolchain" -maxdepth 4 -type d | sed "s#$THEOS/##" | head -n 20 | tr '\n' ' ')"

      - name: Install iPhoneOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set "iPhoneOS$SDK.sdk"
          mkdir -p "$THEOS/sdks"
          cp -R "/tmp/sdks/iPhoneOS$SDK.sdk" "$THEOS/sdks/"

      - name: Inspect SDK stubs
        continue-on-error: true
        run: |
          set +e
          S="$THEOS/sdks/iPhoneOS$SDK.sdk"
          echo "::notice title=SDK $SDK usr/lib/system::$(ls "$S/usr/lib/system" 2>&1 | tr '\n' ' ')"
          echo "::notice title=SDK $SDK libSystem.tbd header::$(head -n 12 "$S/usr/lib/libSystem.tbd" 2>&1 | tr '\n' ' ')"

      - name: Record tool versions
        # Diagnostics only; never fails the job. Results go to public annotations.
        continue-on-error: true
        run: |
          set +e
          echo "::notice title=theos commit::$(git -C "$THEOS" rev-parse --short HEAD)"
          CLANG="$THEOS/toolchain/linux/iphone/bin/clang"
          if [ ! -e "$CLANG" ]; then
            echo "::warning title=clang missing::$(find "$THEOS/toolchain" -name 'clang*' | head -n 10 | tr '\n' ' ')"
            exit 0
          fi
          out=$("$CLANG" --version 2>&1); rc=$?
          echo "::notice title=clang --version (rc=$rc)::$(echo "$out" | head -n 3 | tr '\n' ' ')"
          if [ $rc -ne 0 ]; then
            echo "::warning title=clang missing libraries::$(ldd "$(readlink -f "$CLANG")" 2>&1 | grep -i 'not found' | tr '\n' ' ')"
          fi

      - name: Build package
        working-directory: Unified
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 TARGET="iphone:clang:$SDK:8.0" 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        working-directory: Unified
        run: |
          [ -f build.log ] || exit 0
          # Annotations are truncated at a few KB. Drop colour codes and the
          # known-harmless "tbd built for iOS Simulator" warnings from old
          # SDK stubs so the real error fits. %0A is a newline in a message.
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' build.log \
            | grep -v "but linking in .tbd file" > build.filtered.log || true
          echo "::error title=SDK $SDK build log (filtered, last 40 lines)::$(tail -n 40 build.filtered.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          echo "::error title=SDK $SDK build log (error lines)::$(grep -inE 'error|undefined|not found|unknown|unsupported' build.filtered.log | tail -n 25 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"

      - name: Show package contents
        working-directory: Unified
        run: |
          ls -l packages
          dpkg-deb --info packages/*.deb
          dpkg-deb --contents packages/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: unified-deb-sdk${{ matrix.sdk }}
          path: Unified/packages/*.deb
